N PAYOUT \xB7 NO COSTS",narration:"A fair coin. One hundred dollars. Every time it lands heads, you win half your bankroll. Tails, you lose half. It sounds as though the wins and losses should cancel. Before we talk about markets, watch what happens to the money."},{kind:"fair",s:1,duration:22,title:["One win. One loss.","$25 disappears."],caption:["The loss acts on a different base.","Either order leaves the same $75."],source:"EXACT ARITHMETIC \xB7 $100 \xD7 1.5 \xD7 0.5 = $75",narration:"Heads takes one hundred to one hundred fifty. Now tails takes away half of that larger amount. You finish with seventy-five. Reverse the order and you still finish with seventy-five. The percentages cancel on paper. The money compounds. One win and one loss multiply your wealth by three quarters."},{kind:"fair",s:2,duration:20,title:["A smaller stake","still needs an edge"],caption:["With 50 heads and 50 tails, a 20% stake","turns $100 into about $13."],source:"ILLUSTRATIVE BALANCED PATH \xB7 NOT AN AVERAGE-WEALTH CURVE",narration:"Even at a twenty-percent stake, fifty heads and fifty tails leave about thirteen dollars. This curve tracks balanced compounding, not the average across every possible path. A smaller stake slows the damage. It does not create an advantage. To study a winning game, we need to change the coin."},{kind:"fair",s:3,duration:20,title:["Now heads wins","60% of the time"],caption:["Assume we know the probability exactly.","The payoff still wins or loses the amount staked."],source:"HYPOTHETICAL KNOWN COIN \xB7 INDEPENDENT IDENTICAL TOSSES",narration:"Suppose heads really does arrive sixty percent of the time, and a head wins one dollar for every dollar staked. Now we have an edge. But that leaves the difficult question untouched. Should we risk five percent, twenty percent, or almost everything? We will give every strategy exactly the same tosses."}]},{id:"growth",title:"What optimal means",scenes:[{kind:"growth",s:0,duration:22,title:["Same tosses.","Different fortunes."],caption:["Each strategy reinvests its current bankroll.","Only the fraction at risk changes."],source:"EXACT 10-TOSS EXAMPLE \xB7 6 HEADS AND 4 TAILS",narration:"Here are ten tosses, six heads and four tails. All three strategies see the same sequence. The ten-percent stake takes small steps. Twenty percent compounds faster. Forty percent swings much harder. Winning more often does not tell us how much to risk. The stake changes what a sequence of wins and losses does to the bankroll."},{kind:"growth",s:1,duration:26,title:["Growth has","a sweet spot"],caption:["g(f) = 0.6 log(1 + f) + 0.4 log(1 \u2212 f)","For this coin, the peak occurs at f = 20%."],source:"KELLY 1956 \xB7 EXPECTED LOG WEALTH \xB7 KNOWN STATIONARY ODDS",narration:"We need a ruler for multiplication. Logarithms turn a chain of wealth multipliers into a sum. Weight log of one plus the stake by sixty percent, and log of one minus the stake by forty percent. That gives expected log growth per toss. Increase the stake and growth first rises. It peaks at twenty percent. Keep increasing and the losses overwhelm the advantage."},{kind:"growth",s:2,duration:24,title:["Twice the stake","can erase the edge"],caption:["$100 over 100 tosses with exactly 60 heads.","Twenty percent finishes near $749. Forty near $78."],source:"EXACT CONDITIONAL ENDINGS \xB7 60 WINS / 40 LOSSES",narration:"Extend our example to exactly sixty heads and forty tails. Five percent turns one hundred into about two hundred forty. Ten percent reaches four hundred fifty. Twenty percent reaches seven hundred forty-nine. Forty percent finishes around seventy-eight. The coin never changed. Doubling the growth-optimal stake destroyed the compounded gain."},{kind:"growth",s:3,duration:24,title:["Optimal for","which objective?"],caption:["Kelly maximizes expected log growth.","A drawdown budget asks a different question."],source:"NO UNIVERSAL OPTIMAL POSITION SIZE",narration:"If the goal is the arithmetic average ending, a positive-edge game rewards larger stakes. Rare enormous winners pull up that average. If the goal is long-run compounded growth, Kelly gives a specific peak. If the goal is to stay within a tolerable loss, we must add that constraint. There is no universal optimal size without first naming the objective."}]}];E.push({id:"risk",title:"The price of uncertainty",scenes:[{kind:"risk",s:0,duration:24,title:["A growth optimum","still has deep losses"],caption:["These paths share the same random tosses.","The vertical axis is logarithmic."],source:"80 SEEDED PATHS \xB7 60% KNOWN COIN \xB7 100 TOSSES",narration:"The growth optimum is not a promise of a smooth ride. Here are eighty possible bankroll paths, all using the same sixty-percent coin. Watch the very same tosses as the stake grows from ten percent to twenty. The paths spread apart. Some finish spectacularly. Some spend a long time underwater. This is a logarithmic scale, so equal vertical distances mean equal wealth multiples."},{kind:"risk",s:1,duration:24,title:["Full Kelly can","halve the bankroll"],caption:["Over 100 tosses, the 20% stake almost always","suffers a drawdown of at least 50%."],source:"20,000 SEEDED SIMULATIONS \xB7 DRAWDOWN MEASURED FROM RUNNING PEAK",narration:"Now ask a question a real investor cares about. At any point over one hundred tosses, how often does wealth fall by half from its previous peak? In twenty thousand simulated paths, about two percent at a five-percent stake. About forty-three percent at ten. About ninety-nine percent at full Kelly. A high ending can coexist with a terrifying journey."},{kind:"risk",s:2,duration:23,title:["What if 60%","was really 52%?"],caption:["The 20% stake stays fixed.","A small probability error changes growth\u2019s sign."],source:"SENSITIVITY EXAMPLE \xB7 NOT A CONFIDENCE INTERVAL",narration:"So far we have known the coin. In markets we only estimate it. Suppose we stake twenty percent because we believe the win probability is sixty. Now let the true probability slide toward fifty-two. The stake does not move. Expected log growth crosses below zero. Being slightly better than chance is not enough to justify the size chosen for a much stronger edge."},{kind:"risk",s:3,duration:24,title:["Smaller size","needs a stated reason"],caption:["A probability stress and a Kelly fraction","are assumptions to test, not universal constants."],source:"ILLUSTRATIVE POLICY \xB7 STRESS AND FRACTION CHOSEN FOR TEACHING",narration:"One transparent response is to stress the probability first. If sixty percent becomes fifty-five under that stress, Kelly for the even-money coin falls from twenty percent to ten. Taking half of that gives five percent. This is an illustrative policy, not proof that five percent is optimal. A robust distribution or a drawdown-constrained optimization can give a different answer. The constraint must match the investor\u2019s actual objective."}]});E.push({id:"distribution",title:"The event becomes a distribution",scenes:[{kind:"distribution",s:0,duration:24,title:["Markets have","more than two endings"],caption:["A small rise and a huge rise differ.","A full return forecast preserves that difference."],source:"EDUCATIONAL MIXTURE \xB7 NOT FITTED TO HISTORICAL RETURNS",narration:"A coin has two outcomes. A stock after an event can fall thirty percent, rise one percent, or land anywhere between. Let our two buckets open into a range of possible returns. Each point represents probability mass. The position-sizing question survives, but now we need to know how much we can gain or lose in each state, not only how often the direction is right."},{kind:"distribution",s:1,duration:22,title:["The forecast","has a shape"],caption:["Most weight sits near the center.","The tail components allow larger surprises."],source:"ILLUSTRATIVE NORMAL MIXTURE \xB7 84% CENTER + 8% EACH TAIL",narration:"Gather those possibilities into a density. The height shows where outcomes concentrate. Probability comes from area, not height alone. This teaching curve combines a central component with two wider tail components. We chose it to explain the mechanism. It is not a fitted historical forecast. In a real model, its location, spread, and tails would all need evidence."},{kind:"distribution",s:2,duration:22,title:["A probability","is an area"],caption:["The same forecast answers different questions.","Above zero, this example assigns 58.5%."],source:"NUMERICAL MIXTURE INTEGRAL \xB7 P(R > 0) = 58.4634%",narration:"Draw a line at zero. The area to the right is the probability of a positive return. For this particular curve, that is about fifty-eight and a half percent. Move the threshold or change the horizon and you are asking a different question. A probability is a slice of the forecast. The full distribution contains much more information."},{kind:"distribution",s:3,duration:24,title:["A better center.","An uncertain spread."],caption:["Shift first, then widen around that shift.","Both transformations change the winning area."],source:"CONTROLLED SENSITIVITY \xB7 ONLY ONE FEATURE CHANGES AT A TIME",narration:"Now shift the distribution right while keeping its width unchanged. The probability above zero grows to about seventy-two percent. Freeze the new center and widen the distribution around it. Some mass moves back to the left, bringing the probability down toward sixty-seven percent. The forecast can improve at the center while uncertainty takes some of the apparent advantage away."}]});E.push({id:"price",title:"Probability meets a price",scenes:[{kind:"pricing",s:0,duration:22,title:["Many returns.","Two fixed payouts."],caption:["Above the threshold pays $1. Otherwise $0.","The exact contract rule determines the event."],source:"HYPOTHETICAL FIXED-PAYOUT CONTRACT \xB7 NOT A LISTED EQUITY OPTION",narration:"A fixed-payout contract turns our continuous return into a coin-like payoff. Suppose it pays one dollar if the return finishes above zero and nothing otherwise. A tiny gain and a huge gain now pay the same dollar. The probability of the dollar is exactly the area above the threshold. We have recovered a two-outcome game, but we still need its price."},{kind:"pricing",s:1,duration:24,title:["An advantage","has a price tag"],caption:["Use a rounded 58% probability for the example.","58\xA2 expected payout less 52\xA2 cost leaves 6\xA2."],source:"HYPOTHETICAL TERMS \xB7 $1 PAYOUT \xB7 IGNORE FUNDING FOR THIS EXAMPLE",narration:"Round the teaching probability to fifty-eight percent. A one-dollar claim then has fifty-eight cents of expected payout under our forecast. A fifty-cent midpoint is not an executable cost. Add the spread and fees, and suppose we must pay fifty-two. That leaves six cents of expected profit. The price is a break-even hurdle here. It is not automatically the market\u2019s literal physical probability."},{kind:"pricing",s:2,duration:24,title:["Kelly follows","the actual payoff"],caption:["For a $1 binary with cost c, f* = (p \u2212 c)/(1 \u2212 c).","Here f* is the fraction of wealth spent and at risk."],source:"KNOWN BINARY DISTRIBUTION \xB7 LONG-ONLY SIZE CLAMPED TO 0\u2013100%",narration:"The payoff changed, so the sizing formula changes with it. Buy at fifty-two cents, lose fifty-two on failure, or earn forty-eight on success. For a one-dollar binary, Kelly as the fraction of wealth spent is probability minus cost, divided by one minus cost. Fifty-eight minus fifty-two, divided by forty-eight, gives twelve and a half percent. That result belongs to these exact payoffs."},{kind:"pricing",s:3,duration:25,title:["A call option","needs the whole shape"],caption:["A $100-strike call bought for $3 breaks even at $103","at expiry, before fees. Merely rising may still lose."],source:"VANILLA CALL EXAMPLE \xB7 PAYOFF PER SHARE \xB7 STANDARD CONTRACT \u2248 100 SHARES",narration:"A conventional call is different. Its payoff keeps rising above the strike. With a hundred-dollar strike and a three-dollar premium, a close at one hundred one is a correct bullish call that still loses money. At expiry, break-even is one hundred three before fees. Size from the distribution of net option returns, including the premium and contract multiplier. A single probability of an up day cannot do that job."}]});E.push({id:"calibration",title:"When a probability earns trust",scenes:[{kind:"calibration",s:0,duration:22,title:["\u201C60%\u201D has","an observable meaning"],caption:["Across many comparable 60% forecasts,","roughly 60% should resolve positively."],source:"CALIBRATION CONCEPT \xB7 100 DOTS ARE AN ILLUSTRATION",narration:"A model can produce a confident number without knowing the odds. Calibration gives that number an observable meaning. Across many comparable events assigned sixty percent, roughly sixty percent should happen. That does not mean every group of ten must contain six successes. It means the long-run frequencies should agree with the stated probabilities."},{kind:"calibration",s:1,duration:26,title:["Our real pilot","did not beat 50%"],caption:["326 earnings cases. Brier score 0.251 versus 0.250","for a constant 50% forecast. Lower is better."],source:"REPOSITORY PILOT \xB7 17 JUNE\u201313 AUGUST 2026 \xB7 RETROSPECTIVE",narration:"Now use the evidence we actually have. Our earlier pilot contains three hundred twenty-six earnings cases. For next-close direction, its Brier score is about point two five one. Predicting fifty percent every time scores point two five zero. Lower is better. This test did not demonstrate an advantage over that simple reference. The pharma subset also failed to establish a direction edge."},{kind:"calibration",s:2,duration:24,title:["Confidence needs","a frequency check"],caption:["The 50\u201360% forecast bin averaged 53.3%.","Only 48.2% of its 226 cases finished up."],source:"DESCRIPTIVE PILOT BINS \xB7 CORRELATED EVENTS \xB7 NO INFERENTIAL INTERVALS",narration:"Put average forecast probability on the horizontal axis and observed frequency on the vertical. Perfect calibration lies on the diagonal. In this pilot, the forecasts between fifty and sixty percent averaged fifty-three point three. Only forty-eight point two percent finished up. These are descriptive bins with correlated events, not proof of a permanent bias. They show why we cannot simply put a model\u2019s confidence into Kelly."},{kind:"calibration",s:3,duration:25,title:["A replay cannot","travel back in time"],caption:["The pilot generated forecasts retrospectively.","Calibration for deployment needs untouched future outcomes."],source:"FORECASTS GENERATED 15 AUGUST \xB7 EVENTS OCCURRED EARLIER",narration:"There is a second limitation. The pilot generated its forecasts retrospectively from reconstructed evidence. A current model may already know something about the outcome. Restricting its documents does not erase that possibility. A credible validation freezes the forecast before the outcome, evaluates the next untouched dates, and compares against strong simple baselines. Only then can we ask whether executable returns justify capital."}]});E.push({id:"pharma",title:"The pharma translation",scenes:[{kind:"pharma",s:0,duration:26,title:["A trial can win.","The stock can fall."],caption:["P(trial success) and P(stock rises) differ.","This hypothetical example gives 60% and 45%."],source:"HYPOTHETICAL CONDITIONAL PROBABILITIES \xB7 NOT A CLINICAL FORECAST",narration:"A pharma strategy needs one more translation. Suppose a trial has a sixty-percent chance of succeeding. Even on success, the stock rises only sixty-five percent of the time because expectations and valuation matter. On failure, suppose it still rises fifteen percent of the time. Multiply along each branch and add. The chance the stock rises is forty-five percent, despite a sixty-percent chance of clinical success."},{kind:"pharma",s:1,duration:24,title:["Before and after","are different strategies"],caption:["Pre-event: predict the result and the reaction.","Post-release: interpret what remains after the news."],source:"RESEARCH DESIGN \xB7 KEEP PRE-EVENT AND POST-RELEASE ARMS SEPARATE",narration:"Before an announced event, the model must predict the clinical result, its timing, and how the market will react relative to expectations. After a release, the result is available. The task becomes interpretation: what does the released evidence change, and what return remains after we finish reading it? These are different strategies and need separate ledgers, baselines, and validation."},{kind:"pharma",s:2,duration:24,title:["The trade begins","after the forecast"],caption:["A post-release strategy cannot claim the initial gap.","Entry follows forecast completion and quote availability."],source:"ILLUSTRATIVE PRICE PATH \xB7 NO ACTUAL FILL SHOWN",narration:"The stock may jump before our model finishes its analysis. A post-release strategy cannot take credit for that jump. Start its return clock after the forecast completes, with an eligible executable quote and the chosen latency buffer. This simple timestamp discipline can remove most of an apparently spectacular backtest. What matters is the opportunity that was still available."},{kind:"pharma",s:3,duration:25,title:["The strategy needs","a complete payoff"],caption:["A trial label alone cannot size a share or option.","The return distribution must match entry, horizon and instrument."],source:"PROPOSED RESEARCH WORKFLOW \xB7 NOT A VALIDATED LIVE STRATEGY",narration:"The output should be a return distribution over a named horizon, under the information actually available at entry. Before an event, include the chance that the readout happens after option expiry. For an option, include the payoff, spread, fees, depth, and any mark-to-market exit model. Then account for shared drug, issuer, and sector shocks. Those are the inputs to sizing. A trial-success label alone is not."}]});E.push({id:"recent",title:"A recent historical replay",scenes:[{kind:"recent",s:0,duration:24,title:["Five recent events.","Real price records."],caption:["A selected teaching sample across BMY, AMGN and LLY.","This is not an exhaustive or preselected universe."],source:"ISSUER RELEASES + NASDAQ DAILY OHLC \xB7 10 AUG\u20134 SEP 2026",narration:"Here is a small recent reality check. We collected five announcements across Bristol Myers Squibb, Amgen, and Lilly inside the August tenth to September fourth window, and matched them to Nasdaq daily price records. The sample includes regulatory news, a new topline trial, and follow-up analyses. We selected it for teaching and data availability, not before the outcomes. It cannot establish strategy performance."},{kind:"recent",s:1,duration:25,title:["Positive science","has mixed returns"],caption:["Measure from the next full session\u2019s open to its close.","These are gross price proxies, without trading costs."],source:"5 EVENT ROWS \xB7 DAILY OPEN IS NOT AN EXECUTABLE FILL",narration:"Use one explicit rule: enter at the first regular-session open strictly after the announcement\u2019s calendar date, and measure to that session\u2019s close. The returns are mixed. The Amgen topline example lost about one point two five percent. The Bristol Myers follow-up gained about point eight five percent. The Lilly row lost about two point three six percent and also had acquisition news. We cannot attribute these moves to one clinical headline."},{kind:"recent",s:2,duration:25,title:["One session loses.","Five sessions gain."],caption:["AMGN: \u22121.25% after one session, +1.42% after five.","Another Amgen announcement falls inside that longer window."],source:"AMGN \xB7 ENTRY OPEN 28 AUG $437.89 \xB7 3 SEP CLOSE $444.12",narration:"Follow the Amgen topline example over a longer horizon. From the August twenty-eighth open, the first session lost one point two five percent. Five sessions later, the price gain was one point four two percent. Another Amgen announcement falls inside that longer window, so the cause is mixed. Choosing the horizon after seeing the chart would manufacture a result. The exit rule must be fixed before the test."},{kind:"recent",s:3,duration:24,title:["A useful replay.","An unproven edge."],caption:["No frozen forecasts or option quotes exist for these rows.","Two five-session outcomes are still unavailable at the cutoff."],source:"DESCRIPTIVE EVENT REPLAY \xB7 NO NET P&L OR OPTIMAL-SIZE CLAIM",narration:"This replay verifies that we can join recent announcements to real price records and exposes timing and horizon problems. It does not estimate a model\u2019s trading edge. There are no forecasts frozen before these outcomes, no executable fills, and no historical option quotes in the sample. Two five-session outcomes are unavailable by our cutoff. We leave them missing. We do not turn five selected rows into an optimal position size."}]});E.push({id:"size",title:"A complete sizing calculation",scenes:[{kind:"sizing",s:0,duration:25,title:["One instrument.","Every payoff."],caption:["Hypothetical expiry scenarios for a long call.","The $3 premium includes all costs in this example."],source:"TEACHING DISTRIBUTION \xB7 PRICES AND PROBABILITIES ARE ASSUMED",narration:"Now assemble a complete sizing calculation. Take a hundred-dollar-strike call with an all-in three-dollar premium per share. Suppose the stock ends at ninety with forty-percent probability, at one hundred one with twenty percent, or at one hundred ten with forty percent. The net payoffs are minus three, minus two, and plus seven dollars per share. These are hypothetical scenarios, chosen to make every assumption visible."},{kind:"sizing",s:1,duration:23,title:["You can win less","and still have an edge"],caption:["Only 40% of states earn a profit.","The weighted net payoff is +$1.20 per share."],source:"EXPECTED PAYOFF \u2260 HIT RATE \xB7 EXACT THREE-STATE ARITHMETIC",narration:"This option earns a profit in only forty percent of the states. Yet its expected net payoff is positive. Forty percent times minus three, plus twenty percent times minus two, plus forty percent times seven, equals one dollar twenty per share. A strategy can win less than half the time and still have an edge. That is why the hit rate alone cannot determine its size."},{kind:"sizing",s:2,duration:25,title:["One growth rule.","A richer distribution."],caption:["Average log wealth across all payoff states.","The optimum changes when any probability or payoff changes."],source:"NUMERICAL CONCAVE OPTIMIZATION \xB7 KNOWN THREE-STATE EXAMPLE",narration:"Kelly\u2019s general rule is unchanged. For each state, take the log of the wealth multiplier, weight it by that state\u2019s probability, and add. Here the net returns per dollar at risk are minus one, minus two thirds, and plus seven thirds. The curve peaks at about nineteen percent of wealth spent on premium. That is the full Kelly fraction for this assumed distribution. It is not a live option recommendation."},{kind:"sizing",s:3,duration:25,title:["The cap sets","the executable size"],caption:["At a $500 event-risk cap, one $300 call fits.","Two would exceed the cap."],source:"ILLUSTRATIVE QUARTER KELLY + 0.5% EVENT CAP \xB7 NO LIVE TRADE",narration:"Suppose the account has one hundred thousand dollars. We take a quarter of the calculated Kelly size, then apply a half-percent event-risk cap. The cap allows five hundred dollars at risk. One standard hundred-share call costs three hundred. Two would cost six hundred and exceed the cap. The executable answer is one contract: maximum loss three hundred dollars and expected profit one hundred twenty, under the assumed probabilities."}]});E.push({id:"portfolio",title:"The portfolio has the final word",scenes:[{kind:"portfolio",s:0,duration:24,title:["Positive alpha","can coexist with loss"],caption:["\u22128% market contribution + 3% alpha \u2212 5% residual","gives a \u221210% total return."],source:"ILLUSTRATIVE SINGLE-PERIOD FACTOR DECOMPOSITION",narration:"For shares and long-only funds, returns have shared and company-specific components. Suppose the market contribution is minus eight percent, the process adds three percent of alpha, and the company-specific surprise is minus five. The total is minus ten. Positive alpha means an improvement relative to the appropriate benchmark. It does not mean the account must make money."},{kind:"portfolio",s:1,duration:25,title:["Diversification","has a boundary"],caption:["Independent residual volatility falls as 1/\u221AN.","The common market component remains."],source:"EQUAL-WEIGHT INDEPENDENCE EXAMPLE \xB7 12% RESIDUAL / 15% MARKET VOL",narration:"With equal-sized independent holdings, company-specific volatility averages down roughly with the square root of the number of holdings. Twelve-percent residual volatility becomes about three and a half percent across twelve names. The common fifteen-percent market component remains. And independence is an assumption. Shared biology, funding conditions, or a sector shock can make supposedly separate event bets lose together."},{kind:"portfolio",s:2,duration:24,title:["A good candidate","can still get zero"],caption:["If $800 of a $1,000 pharma cap is already used,","a new $300 contract does not fit."],source:"ILLUSTRATIVE OPEN-RISK CONSTRAINT \xB7 NO REUSE OF COMMITTED CAPITAL",narration:"A candidate can pass its own event cap and still fail the portfolio cap. Suppose the illustrative pharma limit is one thousand dollars of open risk and eight hundred is already committed. Only two hundred remains. Our new three-hundred-dollar call does not fit. Its position is zero. Sizing must see the whole book and the capital already at risk, not repeatedly spend the same available cash."},{kind:"portfolio",s:3,duration:27,title:["The defensible size","follows the evidence"],caption:["Kelly solves the stated growth problem.","Real allocation also requires a validated edge and feasible risk."],source:"CURRENT RESEARCH STATE \xB7 NO PROVEN LIVE EDGE",narration:"We can now answer the original question precisely. For a known repeated game, expected log growth has a calculable optimum. For a real event strategy, we need calibrated payoff forecasts, executable prices, a chosen loss constraint, and joint portfolio risk. Then we round down to what can actually trade. Our current research has not established a live edge, so its allocation remains zero. The mathematics tells us how to size an advantage. The evidence must establish that the advantage exists."}]});E.find(t=>t.id==="growth").scenes.splice(3,0,{kind:"growth",s:4,duration:29,title:["An enormous average.","A shrinking middle."],caption:["At a 40% stake, the mean ending is about $220,000.","The median ending is only $78. Both are exact."],source:"EXACT BINOMIAL DISTRIBUTION \xB7 $100 START \xB7 60% COIN \xB7 100 TOSSES",narration:"Here is why the objective matters so much. At a forty-percent stake, the exact average ending wealth is nearly two hundred twenty thousand dollars. Yet the median is only seventy-eight. Both numbers are correct. Rare, enormous winners pull the average far to the right. The median describes the middle ending. If we optimize the average and then tell the story of a typical investor, we have quietly changed the question."});E.find(t=>t.id==="calibration").scenes.splice(3,0,{kind:"calibration",s:4,duration:29,title:["Calibration can","also make it worse"],caption:["A fitted probability adjustment worsened held-out Brier.","The 53-case test spans only seven event dates."],source:"TRAIN THROUGH 31 JUL \xB7 PURGE 3\u20134 AUG \xB7 TEST FROM 5 AUG \xB7 RETROSPECTIVE",narration:"We also ran one actual calibration experiment on these forecast rows. Fit a single probability adjustment on two hundred forty-one earlier cases. Leave two intervening trading sessions out, then test fifty-three later cases. The Brier score worsened from point two five six seven to point two five seven four. A simple training-frequency baseline did better. Calibration can correct a bias, but it cannot manufacture information. This small r
